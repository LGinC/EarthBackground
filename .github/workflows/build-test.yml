name: Build and test

on:
  workflow_call:

defaults:
  run:
    shell: pwsh

jobs:
  build-test:
    runs-on: windows-latest

    env:
      Solution_Path: EarthBackground.slnx

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore $env:Solution_Path

    - name: Build
      run: dotnet build $env:Solution_Path --configuration Release --no-restore

    - name: Test
      run: dotnet test $env:Solution_Path --configuration Release --no-build --no-restore --verbosity normal
