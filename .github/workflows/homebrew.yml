name: Homebrew

on:
  push:
    paths:
      - Casks/**
      - .github/workflows/homebrew.yml
  pull_request:
    paths:
      - Casks/**
      - .github/workflows/homebrew.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CASK: lginc/earthbackground/earthbackground
      CASK_SOURCE: ${{ github.event_name == 'release' && 'package-artifacts/dist/homebrew-tap/Casks/earthbackground.rb' || 'Casks/earthbackground.rb' }}
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - name: Download release Cask candidate
        if: github.event_name == 'release'
        uses: actions/download-artifact@v8
        with:
          name: EarthBackground-packages-${{ github.sha }}
          path: package-artifacts

      - name: Prepare personal tap
        id: tap
        run: |
          mkdir -p homebrew-evidence
          sw_vers
          uname -m
          brew update
          brew tap lginc/earthbackground https://github.com/LGinC/EarthBackground.git
          tap_path="$(brew --repository lginc/earthbackground)"
          mkdir -p "$tap_path/Casks"
          cp "$CASK_SOURCE" "$tap_path/Casks/earthbackground.rb"
          brew trust --cask "$CASK"
          brew info --cask --json=v2 "$CASK" > homebrew-evidence/cask.json

      - name: Check Cask style
        if: ${{ !cancelled() && steps.tap.outcome == 'success' }}
        run: brew style "$CASK"

      - name: Audit online
        if: ${{ !cancelled() && steps.tap.outcome == 'success' }}
        run: brew audit --cask --online "$CASK"

      - name: Install from personal tap
        id: install
        if: ${{ !cancelled() && steps.tap.outcome == 'success' }}
        run: brew install --cask "$CASK"

      - name: Verify installed code signature
        id: signature
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: codesign --verify --deep --strict --verbose=2 /Applications/EarthBackground.app

      - name: Assess Gatekeeper acceptance
        id: gatekeeper
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: spctl --assess --type execute --verbose=4 /Applications/EarthBackground.app

      - name: Report manual macOS approval requirement
        if: ${{ !cancelled() && steps.signature.outcome == 'success' && steps.gatekeeper.outcome == 'failure' }}
        run: |
          echo '::warning::此个人 Tap 未做 Apple 公证；Gatekeeper 未接受，用户须在 macOS 安全设置中手动授权。未关闭保护或移除隔离属性。'
          echo 'Gatekeeper 未通过：未公证个人 Tap，不保证免确认启动；需要用户手动授权。包完整性校验仍必须通过。' >> "$GITHUB_STEP_SUMMARY"

      - name: Launch installed app and verify its window
        timeout-minutes: 2
        if: ${{ !cancelled() && steps.signature.outcome == 'success' && steps.gatekeeper.outcome == 'success' }}
        run: |
          open -a /Applications/EarthBackground.app
          swift packaging/macos/verify-window.swift

      - name: Capture window and user paths
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          screencapture -x homebrew-evidence/screen.png
          for path in \
            "/Applications/EarthBackground.app/Contents/Resources/appsettings.json" \
            "/Applications/EarthBackground.app/Contents/Resources/nlog.json" \
            "$HOME/Library/Application Support/EarthBackground/appsettings.json" \
            "$HOME/Library/Application Support/EarthBackground" \
            "$HOME/Library/Preferences/io.github.lginc.earthbackground.plist" \
            "$HOME/Library/Saved Application State/io.github.lginc.earthbackground.savedState"; do
            if [ -e "$path" ]; then
              stat -f '%N' "$path" | tee -a homebrew-evidence/user-paths.txt
            else
              printf 'absent: %s\n' "$path" | tee -a homebrew-evidence/user-paths.txt
            fi
          done

      - name: Uninstall and verify zap cleanup
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if pgrep -x EarthBackground; then
            pkill -TERM -x EarthBackground
          fi
          brew uninstall --cask --zap "$CASK"
          test ! -e /Applications/EarthBackground.app
          test ! -e "$HOME/Library/Application Support/EarthBackground"
          test ! -e "$HOME/Library/Preferences/io.github.lginc.earthbackground.plist"
          test ! -e "$HOME/Library/Saved Application State/io.github.lginc.earthbackground.savedState"

      - name: Upload macOS evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-${{ matrix.os }}
          path: homebrew-evidence/
